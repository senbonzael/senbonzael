<!-- <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32"> -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <defs>
    <!-- Плавный диагональный градиент фонового квадрата -->
    <linearGradient id="db-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#918cff" />
      <stop offset="50%" stop-color="#7c76ff" />
      <stop offset="100%" stop-color="#5a52eb" />
    </linearGradient>

    <!-- Тень, направленная вверх и влево (отрицательные значения dx и dy) -->
    <filter id="ultra-shadow-top-left" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-0.6" dy="-0.8" stdDeviation="0.3" flood-color="#140f54" flood-opacity="0.95"/>
    </filter>
  </defs>
  
  <!-- Квадрат со скругленными углами -->
  <rect width="32" height="32" rx="7" fill="url(#db-gradient)" />
  
  <!-- Иконка базы данных (Масштаб 1.25, центрирована) -->
  <path fill="#ffffff" transform="translate(-4, -4) scale(1.25)" d="M16 6.25c-3.974 0-8.25.939-8.25 3v13.5c0 2.061 4.276 3 8.25 3s8.25-.939 8.25-3V9.25c0-2.061-4.276-3-8.25-3m0 1.5c4.349 0 6.596 1.076 6.748 1.5-.152.425-2.4 1.5-6.748 1.5-4.38 0-6.63-1.092-6.75-1.487v-.003c.12-.395 2.37-1.51 6.75-1.51m-6.75 3.321c1.596.8 4.232 1.179 6.75 1.179s5.154-.379 6.75-1.179v2.67c-.12.417-2.37 1.509-6.75 1.509-4.387 0-6.637-1.095-6.75-1.5zm0 4.5c1.596.8 4.232 1.179 6.75 1.179s5.154-.379 6.75-1.179v2.67c-.12.417-2.37 1.509-6.75 1.509-4.387 0-6.637-1.095-6.75-1.5zm6.75 8.25c-4.388 0-6.638-1.095-6.75-1.5v-2.679c1.596.8 4.232 1.179 6.75 1.179s5.154-.379 6.75-1.179v2.67c-.12.417-2.37 1.509-6.75 1.509" />

  <!-- Крупная надпись SQL с тенью, падающей вверх и влево -->
  <text x="29" y="29.5" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="900" 
        text-anchor="end"
        filter="url(#ultra-shadow-top-left)">SQL</text>
</svg>
